name: mcc
version: 0.1.0.0
github: jmorag/mcc
synopsis: A microc compiler in Haskell
author: "Joseph Morag"
license-file: LICENSE
category: Compilers/Interpreters
ghc-options: -Wall 
             -fno-warn-name-shadowing 
             -Wincomplete-uni-patterns
             -fno-defer-type-errors
extra-source-files:
  - README.md
  - src/Microc/Parser/Generator.y
  - src/Microc/Scanner/Generator.x

dependencies:
    - base >= 4.7 && < 5
    - BNFC
    - mtl
    - array
    - cereal
    - containers
    - text
    - string-conversions
    - deepseq
    - directory
    - process
    - unix
    - filepath
    - bytestring
    - prettyprinter
      # - llvm-hs-pure >= 9 && < 10
      # - llvm-hs >= 9 && < 10
      # - llvm-hs-pretty >= 0.9 && < 1
    - megaparsec
    - parser-combinators

default-extensions: OverloadedStrings, LambdaCase

library:
  source-dirs: src
  build-tools:
    - alex
    - happy
  other-modules:
    - Microc.Parser.Generator
    - Microc.Scanner.Generator

executable:
  main: Main.hs
  source-dirs: app
  build-tools:
    - alex
    - happy
  dependencies: 
      - optparse-applicative
      - mcc
      - pretty-simple

tests:
  testall:
    main: Testall.hs
    source-dirs: tests
    dependencies:
        - tasty
        - tasty-golden
        - tasty-hunit
        - mcc

benchmarks:
  bench:
    main: Bench.hs
    source-dirs: bench
    dependencies:
        - criterion
        - mcc
        - tasty-golden
